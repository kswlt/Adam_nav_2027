schema_version: 1
lock_status: partial  # Only sources with a commit field are actually pinned.
platform:
  os: ubuntu-24.04
  ros: jazzy
  architecture: x86_64
  target: ASUS NUC 15 Pro
profiles:
  stable_baseline:
    - small_gicp
    - ros-jazzy-nav2-bringup
    - ros-jazzy-nav2-mppi-controller
    - ros-jazzy-ros2-control
    - ros-jazzy-robot-localization
    - ros-jazzy-grid-map
    - ros-jazzy-diagnostic-updater
  target_required:
    - kiss_matcher
    - gtsam
    - tdt-nav-kit
  enhanced:
    - rog_map
sources:
  small_gicp:
    url: https://github.com/koide3/small_gicp.git
    commit: fa0cfc983417c044b6036f71dfa448038bb9c820
    upstream_version: 1.0.1
    license: MIT
  my_serial_py:
    source: original-workspace
    path: src/my_serial_py
    protocol: frozen-until-interface-review
  pb_rm_interfaces:
    source: original-workspace
    path: src/pb_rm_interfaces
policy:
  apt_packages_are_preferred: true
  third_party_requires_exact_commit: true
  upstream_patches_are_concentrated: true
