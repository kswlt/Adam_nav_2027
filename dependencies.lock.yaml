schema_version: 1
lock_status: partial  # Only sources with a commit field are actually pinned.
platform:
  os: ubuntu-24.04
  ros: jazzy
  architecture: x86_64
  target: ASUS NUC 15 Pro
profiles:
  stable_baseline:
    - small_point_lio
    - small_gicp
    - ros-jazzy-nav2-bringup
    - ros-jazzy-nav2-mppi-controller
    - ros-jazzy-ros2-control
    - ros-jazzy-robot-localization
    - ros-jazzy-grid-map
    - ros-jazzy-diagnostic-updater
  target_required:
    - kiss_matcher
    - gtsam
    - tdt-nav-kit
  enhanced:
    - rog_map
sources:
  gtsam:
    url: https://github.com/borglab/gtsam.git
    commit: 4f66a491ffc83cf092d0d818b11dc35135521612
    upstream_tag: 4.2.0
    license: BSD-3-Clause
    build: tools/bootstrap_gtsam.sh
    options: system Eigen; no unstable/Python/TBB; Release -O1; one compiler; user-prefix RPATH
  small_point_lio:
    url: https://github.com/Yancey2023/small_point_lio.git
    commit: 688d75cfa780049ae532e5100ca64f46ad8b1a93
    branch: ros2
    license: MIT
    patch: tools/patches/small_point_lio_raw_state.patch
    patch_scope: raw IMU pose and covariance publication; odom cloud frame; publish_tf switch
  kiss_matcher:
    url: https://github.com/MIT-SPARK/KISS-Matcher.git
    commit: e3440b63340af7414ebd0fdde04e40f02ff4e7d2
    upstream_tag: v1.0.2
    cpp_project_version: 0.3.0
    license: MIT
  robin:
    url: https://github.com/MIT-SPARK/ROBIN.git
    commit: 1832f4cc4cba357699b093c2751c0690c29a2442
    upstream_tag: v.1.2.7
  pmc:
    url: https://github.com/MIT-SPARK/pmc.git
    commit: 4bbd40ababd8e925c4e1845c509173afe766b443
  xenium:
    url: https://github.com/mpoeter/xenium.git
    commit: 1c449ae953ce2a440b0d16c5ed1181d2754860ab
    pin_patch: tools/bootstrap_kiss_matcher.sh
  small_gicp:
    url: https://github.com/koide3/small_gicp.git
    commit: fa0cfc983417c044b6036f71dfa448038bb9c820
    upstream_version: 1.0.1
    license: MIT
  my_serial_py:
    source: original-workspace
    path: src/my_serial_py
    protocol: frozen-until-interface-review
  pb_rm_interfaces:
    source: original-workspace
    path: src/pb_rm_interfaces
policy:
  apt_packages_are_preferred: true
  third_party_requires_exact_commit: true
  upstream_patches_are_concentrated: true
