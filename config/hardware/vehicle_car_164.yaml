schema_version: 1
profile_id: vehicle-car-164
status: partial_hardware_profile
platform: ASUS NUC 15 Pro on vehicle
ros_distro: humble
vehicle_model: omni_single_yaw
coordinate_convention: REP-103; x-forward, y-left, z-up

network:
  wifi_ip: 192.168.1.164
  lidar_interface: enp86s0
  lidar_host_ip: 192.168.1.50
  lidar_ip: 192.168.1.152
  lidar_route: 192.168.1.152/32

serial:
  package: my_serial_py
  device: /dev/ttyUSB0
  usb_model: Silicon_Labs_CP2102
  baud_rate: 115200
  tx_semantics: planar_xy_plus_yaw_target_degree
  physical_output_enabled: false

vehicle:
  drive_type: omni
  yaw_control: single_yaw_target
  yaw_rate_command_supported: false

sensor_mount:
  sensor_frame: front_mid360
  nominal_orientation: upright_identity_rotation
  lateral_offset_m: 0.08
  lateral_direction: left_positive_y
  longitudinal_offset_m: 0.0
  height_m: 0.2
  measured_calibration_required: false
  imu_extrinsic_source: mid360_factory_calibration
  note: User confirmed radar is upright, centered longitudinally, 0.20 m high, and 0.08 m left of vehicle center. MID-360 factory LiDAR-IMU calibration is used internally by the driver; the chassis mount transform remains a separate vehicle calibration.

startup_policy:
  allow_legacy_static_calibration: false
  enable_physical_output: false
  require_measured_twist: true
  require_drive_ready: true
  feedback_integration: deferred_by_user
